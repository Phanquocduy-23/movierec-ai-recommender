version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: movierec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: movierec_password
      POSTGRES_DB: movierec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d movierec"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: movierec-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:movierec_password@postgres:5432/movierec
      JWT_SECRET_KEY: movierec-production-jwt-secret-key-235019
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./data:/workspace/data
      - ./artifacts:/workspace/artifacts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: movierec-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"

volumes:
  pgdata:
